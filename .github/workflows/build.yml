name: Build

on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x.x
          cache: npm
      - name: Install deps
        run:  npm ci
      - name: Validate
        run:  npm run validate
